version: '3.8'

# ---------------------------------------------------------
# CONFIGURAÇÕES COMUNS DO AIRFLOW (Na raiz, FORA de services)
# ---------------------------------------------------------
x-airflow-common:
  &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.8.1}
  environment:
    &airflow-common-env
    AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW__WEBSERVER__SECRET_KEY}"
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgrespassword@postgres:5432/panorama_db
    AIRFLOW__CORE__FERNET_KEY: wX9p1q6Z8V_uR2m4N_7T3y5k9G_0C8b2H5v1A_5s9K8=
    AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
  volumes:
    - ./dags:/opt/airflow/dags           
    - ./pipelines:/opt/airflow/pipelines  
    - ./config:/opt/airflow/config
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_started

services:
  # 1. MongoDB (Data Lake Bruto)
  mongodb:
    image: mongo:latest
    container_name: panorama_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    volumes:
      - mongo_data:/data/db

  # 2. PostgreSQL (Modelo Analítico)
  postgres:
    image: postgres:16-alpine
    container_name: panorama_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: panorama_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 3. Redis (Cache)
  redis:
    image: redis:alpine
    container_name: panorama_redis
    restart: always
    ports:
      - "6379:6379"

  # ---------------------------------------------------------
  # SERVIÇOS DO AIRFLOW DIVIDIDOS
  # ---------------------------------------------------------
  
  # 1. Serviço que inicializa o banco e força a criação do usuário
  airflow-init:
    <<: *airflow-common
    container_name: panorama_airflow_init
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      _AIRFLOW_WWW_USER_ROLE: Admin
      _AIRFLOW_WWW_USER_EMAIL: admin@panorama.com

  # 2. Interface Web (A tela do localhost:8080)
  airflow-webserver:
    <<: *airflow-common
    container_name: panorama_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      postgres:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully

  # 3. Orquestrador (Quem dispara as DAGs)
  airflow-scheduler:
    <<: *airflow-common
    container_name: panorama_airflow_scheduler
    command: scheduler
    restart: always
    depends_on:
      postgres:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully

volumes:
  mongo_data:
  postgres_data: