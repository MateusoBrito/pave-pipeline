version: '3.8'

x-airflow-common:
  &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.8.1}
  environment:
    &airflow-common-env
    AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW__WEBSERVER__SECRET_KEY}"
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
  volumes:
    - ./dags:/opt/airflow/dags           
    - ./pipelines:/opt/airflow/pipelines  
    - ./config:/opt/airflow/config
    - ./src:/opt/airflow/src
    - ./logs:/opt/airflow/logs
    - ./reports:/opt/airflow/reports
    - ./data/topic_modeling:/opt/airflow/results_modelagem
    - /home/labpi/pave-tm:/opt/airflow/pave-tm
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_started
  networks:
    - pave_network  

services:
  mongodb:
    image: mongo:7.0
    container_name: panorama-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "${MONGO_BIND_ADDRESS:-127.0.0.1}:27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_configdb:/data/configdb
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - pave_network

  # 2. PostgreSQL (Modelo Analítico)
  postgres:
    image: postgres:16-alpine
    container_name: panorama-postgres
    restart: always
    ports:
      - "19032:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
      - ./data/fotos:/app/fotos
    networks:
      - pave_network

  # 3. Redis (Cache)
  redis:
    image: redis:alpine
    container_name: panorama-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - pave_network

  # 4. Airflow Standalone (Sua ferramenta de orquestração)
  airflow:
    build:
      context: .
      dockerfile: Dockerfile
    image: pave-airflow:latest
    container_name: panorama-airflow
    restart: always
    shm_size: 4gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - postgres
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT=300
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      # Único knob de cadência da modelagem de tópicos: quantos dias tem um "período"
      # (modelo ajustado por período) e a partir de qual data a grade de períodos é
      # contada. Lido tanto por pave-tm (pipeline/config.py) quanto pelas DAGs de
      # modelagem/inferência (dag_topic_modeling.py, infer_topic.py) - mudar SÓ isto
      # aqui (e reiniciar o container) troca diário <-> semanal <-> qualquer N dias,
      # sem editar nenhum desses arquivos. PERIOD_EPOCH deve ficar numa segunda-feira
      # se PERIOD_DAYS=7, pra bater com semana ISO; qualquer data serve pra outros N.
      - TOPIC_MODEL_PERIOD_DAYS=${TOPIC_MODEL_PERIOD_DAYS:-7}
      - TOPIC_MODEL_PERIOD_EPOCH=${TOPIC_MODEL_PERIOD_EPOCH:-2026-07-27}
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags         
      - ./pipelines:/opt/airflow/pipelines  
      - ./config:/opt/airflow/config
      - ./src:/opt/airflow/src
      - ./logs:/opt/airflow/logs
      - ./reports:/opt/airflow/reports
      - ./data/topic_modeling:/opt/airflow/results_modelagem
      - /home/labpi/pave-tm:/opt/airflow/pave-tm
    command: standalone
    networks:
      - pave_network

volumes:
  mongo_data:
  mongo_configdb:
  postgres_data:

networks:
  pave_network:
    external: true