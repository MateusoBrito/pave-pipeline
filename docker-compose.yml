version: '3.8'

# ---------------------------------------------------------
# CONFIGURAÇÕES COMUNS DO AIRFLOW (Na raiz, FORA de services)
# ---------------------------------------------------------
x-airflow-common:
  &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.8.1}
  environment:
    &airflow-common-env
    AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW__WEBSERVER__SECRET_KEY}"
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgrespassword@postgres:5432/panorama_db
    AIRFLOW__CORE__FERNET_KEY: wX9p1q6Z8V_uR2m4N_7T3y5k9G_0C8b2H5v1A_5s9K8=
    AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
  volumes:
    - ./dags:/opt/airflow/dags           
    - ./pipelines:/opt/airflow/pipelines  
    - ./config:/opt/airflow/config
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_started

services:
  mongodb:
    image: mongo:7.0
    container_name: panorama-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "${MONGO_BIND_ADDRESS:-127.0.0.1}:27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_configdb:/data/configdb
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # 2. PostgreSQL (Modelo Analítico)
  postgres:
    image: postgres:16-alpine
    container_name: panorama-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 3. Redis (Cache)
  redis:
    image: redis:alpine
    container_name: panorama-redis
    restart: always
    ports:
      - "6379:6379"

  # 4. Airflow Standalone (Sua ferramenta de orquestração)
  airflow:
    image: apache/airflow:2.8.1-python3.11
    container_name: panorama-airflow
    restart: always
    depends_on:
      - postgres
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _PIP_ADDITIONAL_REQUIREMENTS=pymongo requests pyyaml google-api-python-client pandas
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags         
      - ./pipelines:/opt/airflow/pipelines  
      - ./config:/opt/airflow/config 
    command: standalone

volumes:
  mongo_data:
  mongo_configdb:
  postgres_data: